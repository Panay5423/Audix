<div class="flex h-screen w-screen overflow-hidden transition-colors duration-500 relative"
  [ngClass]="activeTheme === 'light' ? 'bg-slate-100 text-slate-800' : 'bg-[#09090b] text-white'">

  <!-- Ambient Glow effect for dashboard pages -->
  <div class="absolute top-[-25%] left-[25%] right-[25%] h-[600px] rounded-full blur-[180px] pointer-events-none transition-all duration-500"
    [ngClass]="activeTheme === 'spotify' 
      ? 'bg-emerald-600/5' 
      : activeTheme === 'light' 
        ? 'bg-indigo-600/5' 
        : 'bg-violet-600/5'">
  </div>

  <!-- Sidebar (Left) -->
  <app-side-bar></app-side-bar>

  <!-- Main Area (Right) -->
  <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
    <!-- Topbar Header -->
    <app-top-bar></app-top-bar>

    <!-- Content Pages (Dashboard, etc.) -->
    <main class="flex-grow overflow-y-auto px-6 py-8 scrollbar-thin relative z-10">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
