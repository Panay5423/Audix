<header class="w-full border-b px-6 py-3.5 flex items-center justify-between transition-all duration-300 relative z-20"
  [ngClass]="activeTheme === 'light' 
    ? 'bg-white border-slate-200 text-slate-800' 
    : 'bg-[#09090b]/80 backdrop-blur-md border-white/5 text-zinc-300'">

  <!-- Left: Page Title / Breadcrumbs -->
  <div class="flex items-center space-x-2.5">
    <span class="text-xs font-mono text-zinc-500 uppercase tracking-widest hidden sm:inline">Audix</span>
    <span class="text-zinc-600 font-light hidden sm:inline">/</span>
    <h1 class="text-sm font-extrabold tracking-wide uppercase font-mono"
      [ngClass]="activeTheme === 'light' ? 'text-slate-900' : 'text-white'">
      {{ getBreadcrumb() }}
    </h1>
  </div>

  <!-- Center: Quick Search Bar -->
  <div class="hidden md:flex items-center flex-1 max-w-md mx-6">
    <form (ngSubmit)="onSearchSubmit()" class="w-full relative flex items-center">
      <input type="text"
        [(ngModel)]="searchQuery"
        name="topSearch"
        placeholder="Search tracks, artists, albums, or vibes..."
        class="w-full pl-9 pr-4 py-1.5 rounded-full text-xs font-medium border transition-all duration-200 outline-none"
        [ngClass]="activeTheme === 'light'
          ? 'bg-slate-100 border-slate-200 text-slate-800 placeholder-slate-400 focus:border-indigo-500 focus:bg-white'
          : 'bg-white/5 border-white/10 text-white placeholder-zinc-500 focus:border-violet-500 focus:bg-[#121216]'">
      <svg class="h-3.5 w-3.5 text-zinc-500 absolute left-3 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </form>
  </div>

  <!-- Right: Actions -->
  <div class="flex items-center space-x-4">
    <!-- Spotify Status Badge -->
    <div class="hidden xs:flex items-center space-x-2 rounded-full border px-3 py-1 text-[10px] font-bold uppercase tracking-wider font-mono transition-colors duration-300"
      [ngClass]="activeTheme === 'light' 
        ? 'border-slate-200 bg-slate-50 text-slate-600' 
        : 'border-white/5 bg-[#121214]/60 text-zinc-400'">
      <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
      <span>Spotify Live</span>
    </div>

    <!-- Theme Switcher Dropdown -->
    <div class="relative flex items-center">
      <button (click)="showThemeDropdown = !showThemeDropdown"
        class="inline-flex items-center space-x-1.5 rounded-full px-3 py-1.5 text-xs font-semibold uppercase tracking-wider transition-all duration-200 active:scale-95 cursor-pointer border"
        [ngClass]="activeTheme === 'light' ? 'border-slate-200 bg-white hover:bg-slate-50 text-slate-800' : 'border-white/5 bg-white/5 hover:bg-white/10 text-white'">
        <svg class="h-3.5 w-3.5 transition-colors duration-300" [ngClass]="getThemeLogoColorClass()" fill="none"
          viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" />
        </svg>
        <span class="hidden sm:inline">
          <span [ngClass]="getThemeTextClass()" class="font-extrabold">
            {{ activeTheme === 'purple' ? 'Amethyst' : activeTheme === 'spotify' ? 'Spotify' : 'Ice Light' }}
          </span>
        </span>
      </button>

      <!-- Dropdown Menu -->
      <div *ngIf="showThemeDropdown"
        class="absolute right-0 top-full mt-2 w-48 origin-top-right rounded-2xl border p-2 shadow-2xl backdrop-blur-xl transition-all duration-200 z-50 animate-[fadeIn_0.15s_ease-out]"
        [ngClass]="activeTheme === 'light' ? 'border-slate-200 bg-white/95 shadow-slate-200' : 'border-white/10 bg-[#121214]/95 shadow-black'">
        <div class="space-y-1">
          <!-- Amethyst -->
          <button (click)="setTheme('purple')"
            class="w-full flex items-center justify-between rounded-xl p-2 text-left text-xs font-semibold cursor-pointer"
            [ngClass]="activeTheme === 'purple' ? 'bg-white/5 text-violet-400 font-bold' : 'text-zinc-400 hover:bg-white/5'">
            <div class="flex items-center space-x-2">
              <span class="h-2.5 w-2.5 rounded-full bg-violet-600"></span>
              <span>Amethyst Void</span>
            </div>
          </button>
          <!-- Spotify -->
          <button (click)="setTheme('spotify')"
            class="w-full flex items-center justify-between rounded-xl p-2 text-left text-xs font-semibold cursor-pointer"
            [ngClass]="activeTheme === 'spotify' ? 'bg-white/5 text-emerald-400 font-bold' : 'text-zinc-400 hover:bg-white/5'">
            <div class="flex items-center space-x-2">
              <span class="h-2.5 w-2.5 rounded-full bg-emerald-500"></span>
              <span>Spotify Classic</span>
            </div>
          </button>
          <!-- Light -->
          <button (click)="setTheme('light')"
            class="w-full flex items-center justify-between rounded-xl p-2 text-left text-xs font-semibold cursor-pointer"
            [ngClass]="activeTheme === 'light' ? 'bg-slate-100 text-indigo-600 font-bold' : 'text-zinc-400 hover:bg-white/5'">
            <div class="flex items-center space-x-2">
              <span class="h-2.5 w-2.5 rounded-full bg-slate-300"></span>
              <span>Ice Light</span>
            </div>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
