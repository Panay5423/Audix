<div class="fixed bottom-0 left-0 right-0 h-22 border-t z-50 backdrop-blur-xl transition-all duration-300"
  [ngClass]="activeTheme === 'light' 
    ? 'bg-white/95 border-slate-200 text-slate-800 shadow-2xl' 
    : 'bg-[#09090b]/95 border-white/5 text-zinc-200 shadow-[0_-10px_30px_rgba(0,0,0,0.8)]'">

  <!-- Notification Banner if active -->
  <div *ngIf="statusMessage"
    class="absolute -top-7 left-1/2 -translate-x-1/2 px-3 py-1 rounded-full text-[10px] font-mono tracking-wide font-semibold shadow-lg border animate-[fadeIn_0.2s_ease-out]"
    [ngClass]="activeTheme === 'light' 
      ? 'bg-indigo-50 text-indigo-700 border-indigo-200' 
      : 'bg-violet-950/90 text-violet-300 border-violet-700/50'">
    {{ statusMessage }}
  </div>

  <div class="h-full max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between gap-4">

    <!-- 1. Left: Track Info -->
    <div class="flex items-center space-x-3 w-1/4 min-w-[180px]">
      <div class="relative h-13 w-13 rounded-xl overflow-hidden shrink-0 border shadow-md"
        [ngClass]="activeTheme === 'light' ? 'border-slate-200 bg-slate-100' : 'border-white/10 bg-zinc-900'">
        <img *ngIf="currentTrack?.albumArt" [src]="currentTrack?.albumArt" [alt]="currentTrack?.name"
          class="h-full w-full object-cover">
        <div *ngIf="!currentTrack?.albumArt" class="h-full w-full flex items-center justify-center text-lg text-zinc-500">
          🎵
        </div>
      </div>

      <div class="overflow-hidden space-y-0.5">
        <h4 class="text-xs font-bold truncate hover:underline cursor-pointer"
          [ngClass]="activeTheme === 'light' ? 'text-slate-900' : 'text-white'"
          [title]="currentTrack?.name || 'No Track Selected'">
          {{ currentTrack?.name || 'Ready to Play' }}
        </h4>
        <p class="text-[11px] truncate text-zinc-500 font-medium"
          [title]="currentTrack?.artist || 'Choose any song to begin listening'">
          {{ currentTrack?.artist || 'Audix Music Engine' }}
        </p>
      </div>
    </div>

    <!-- 2. Center: Controls & Scrub Bar -->
    <div class="flex flex-col items-center justify-center flex-1 max-w-xl space-y-1.5">
      <!-- Buttons -->
      <div class="flex items-center space-x-4">
        <!-- Previous -->
        <button (click)="previous()" title="Previous Track"
          class="h-8 w-8 rounded-full flex items-center justify-center transition-all duration-150 active:scale-90 text-zinc-400 hover:text-white cursor-pointer">
          <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
          </svg>
        </button>

        <!-- Play / Pause -->
        <button (click)="togglePlay()" title="Play / Pause"
          class="h-10 w-10 rounded-full flex items-center justify-center transition-all duration-200 active:scale-95 shadow-md cursor-pointer"
          [ngClass]="getThemeBgClass()">
          <svg *ngIf="!isPlaying" class="h-5 w-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg *ngIf="isPlaying" class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>

        <!-- Next -->
        <button (click)="next()" title="Next Track"
          class="h-8 w-8 rounded-full flex items-center justify-center transition-all duration-150 active:scale-90 text-zinc-400 hover:text-white cursor-pointer">
          <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>
      </div>

      <!-- Scrubber -->
      <div class="w-full flex items-center space-x-2.5 text-[10px] font-mono text-zinc-500">
        <span class="w-8 text-right">{{ formatTime(progressMs) }}</span>
        <div class="relative flex-1 flex items-center">
          <input type="range"
            [min]="0"
            [max]="durationMs || 100"
            [value]="progressMs"
            (input)="onSeek($event)"
            class="w-full h-1 rounded-full cursor-pointer appearance-none bg-zinc-700/50 hover:bg-zinc-600 transition-colors"
            [ngClass]="getThemeProgressClass()">
        </div>
        <span class="w-8">{{ formatTime(durationMs) }}</span>
      </div>
    </div>

    <!-- 3. Right: Volume & Device -->
    <div class="flex items-center justify-end space-x-4 w-1/4 min-w-[180px]">
      <!-- Device Selector Dropdown -->
      <div class="relative">
        <button (click)="showDeviceMenu = !showDeviceMenu"
          title="Spotify Connect Devices"
          class="flex items-center space-x-1.5 p-1.5 rounded-lg text-xs font-mono transition-colors border cursor-pointer"
          [ngClass]="activeDevice 
            ? (activeTheme === 'spotify' ? 'border-emerald-500/30 text-emerald-400 bg-emerald-500/10' : 'border-violet-500/30 text-violet-400 bg-violet-500/10')
            : 'border-transparent text-zinc-500 hover:text-zinc-300'">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
          <span class="hidden md:inline text-[10px] truncate max-w-[80px]">
            {{ activeDevice?.name || 'Device' }}
          </span>
        </button>

        <!-- Dropdown -->
        <div *ngIf="showDeviceMenu"
          class="absolute right-0 bottom-full mb-2 w-56 rounded-2xl border p-2 shadow-2xl backdrop-blur-xl z-50 animate-[fadeIn_0.15s_ease-out]"
          [ngClass]="activeTheme === 'light' ? 'bg-white/95 border-slate-200' : 'bg-[#121214]/95 border-white/10'">
          <div class="px-2 py-1 text-[9px] font-mono tracking-widest text-zinc-500 uppercase border-b pb-1.5 mb-1"
            [ngClass]="activeTheme === 'light' ? 'border-slate-100' : 'border-white/5'">
            Select Output Device
          </div>
          <div *ngIf="devices.length === 0" class="p-2 text-xs text-zinc-500 text-center">
            No active Spotify devices found. Open Spotify app.
          </div>
          <button *ngFor="let device of devices"
            (click)="selectDevice(device.id)"
            class="w-full flex items-center justify-between p-2 rounded-xl text-xs font-semibold text-left transition-colors cursor-pointer"
            [ngClass]="device.is_active ? getThemeTextClass() : 'text-zinc-400 hover:bg-white/5'">
            <div class="truncate mr-2">
              <p class="font-bold truncate">{{ device.name }}</p>
              <p class="text-[9px] uppercase font-mono text-zinc-500">{{ device.type }}</p>
            </div>
            <span *ngIf="device.is_active" class="h-2 w-2 rounded-full bg-emerald-500"></span>
          </button>
        </div>
      </div>

      <!-- Volume Slider -->
      <div class="hidden sm:flex items-center space-x-2">
        <svg class="h-4 w-4 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
        </svg>
        <input type="range"
          [min]="0"
          [max]="100"
          [value]="volume"
          (input)="onVolumeChange($event)"
          class="w-20 h-1 rounded-full cursor-pointer appearance-none bg-zinc-700/50 hover:bg-zinc-600 transition-colors"
          [ngClass]="getThemeProgressClass()">
      </div>
    </div>

  </div>
</div>
