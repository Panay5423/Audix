<div class="space-y-8 animate-[fadeIn_0.3s_ease-out]">
  <!-- Header Banner -->
  <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b pb-6"
    [ngClass]="activeTheme === 'light' ? 'border-slate-200' : 'border-white/5'">
    <div>
      <h2 class="text-2xl sm:text-3xl font-black tracking-tight" [ngClass]="activeTheme === 'light' ? 'text-slate-900' : 'text-white'">
        My Spotify Playlists
      </h2>
      <p class="text-xs sm:text-sm text-zinc-400 mt-1">
        Manage, reorganize, and create playlists synced directly with your Spotify account.
      </p>
    </div>

    <button (click)="showCreateModal = true"
      class="px-5 py-2.5 rounded-2xl text-xs font-bold transition-all active:scale-95 shadow-lg flex items-center space-x-2 cursor-pointer"
      [ngClass]="getThemeBgClass()">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      <span>New Playlist</span>
    </button>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="flex flex-col items-center justify-center min-h-[300px] space-y-4">
    <div class="h-10 w-10 border-4 border-t-transparent rounded-full animate-spin"
      [ngClass]="activeTheme === 'spotify' ? 'border-emerald-500' : (activeTheme === 'light' ? 'border-indigo-600' : 'border-violet-500')"></div>
    <p class="text-zinc-500 text-xs font-mono font-semibold">Syncing Playlist Library...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="p-6 rounded-2xl border border-red-500/20 bg-red-500/5 text-center space-y-3">
    <p class="text-sm font-semibold text-red-400">{{ error }}</p>
    <button (click)="loadPlaylists()" class="px-4 py-2 rounded-xl text-xs font-bold bg-white/10 hover:bg-white/20 text-white cursor-pointer">
      Retry
    </button>
  </div>

  <!-- Playlists Grid -->
  <div *ngIf="!loading && !error" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
    <div *ngFor="let playlist of playlists"
      [routerLink]="['/playlist', playlist.id]"
      class="group rounded-2xl p-3.5 border transition-all duration-300 hover:-translate-y-1 cursor-pointer flex flex-col justify-between"
      [ngClass]="activeTheme === 'light' ? 'bg-white border-slate-200/80 shadow-sm hover:shadow-md' : 'bg-[#0e0e11] border-white/5 hover:border-violet-500/30'">
      
      <div class="relative aspect-square rounded-xl overflow-hidden mb-3 border shadow-md"
        [ngClass]="activeTheme === 'light' ? 'border-slate-100 bg-slate-100' : 'border-white/5 bg-zinc-900'">
        <img *ngIf="playlist.images?.[0]?.url" [src]="playlist.images[0].url" [alt]="playlist.name" class="h-full w-full object-cover group-hover:scale-105 transition-transform duration-300">
        <div *ngIf="!playlist.images?.[0]?.url" class="h-full w-full flex items-center justify-center text-3xl text-zinc-600">
          📁
        </div>
      </div>

      <div>
        <h4 class="text-xs font-bold truncate group-hover:underline" [ngClass]="activeTheme === 'light' ? 'text-slate-900' : 'text-white'" [title]="playlist.name">
          {{ playlist.name }}
        </h4>
        <p class="text-[11px] text-zinc-500 font-mono mt-0.5">
          {{ playlist.tracks?.total ?? 0 }} tracks • {{ playlist.owner?.display_name || 'Spotify' }}
        </p>
      </div>
    </div>
  </div>

  <!-- Create Playlist Modal -->
  <div *ngIf="showCreateModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 animate-[fadeIn_0.15s_ease-out]">
    <div class="rounded-3xl p-6 sm:p-8 max-w-md w-full border shadow-2xl space-y-5"
      [ngClass]="activeTheme === 'light' ? 'bg-white border-slate-200 text-slate-800' : 'bg-[#121216] border-white/10 text-white'">
      <div class="flex items-center justify-between">
        <h3 class="text-base font-bold font-mono uppercase">Create New Playlist</h3>
        <button (click)="showCreateModal = false" class="text-zinc-400 hover:text-white text-lg cursor-pointer">✕</button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="text-[10px] uppercase font-mono tracking-wider text-zinc-400 block mb-1">Playlist Title</label>
          <input type="text" [(ngModel)]="newPlaylistName" placeholder="e.g. Late Night Lo-Fi Chill"
            class="w-full px-3.5 py-2.5 rounded-xl text-xs font-semibold border outline-none"
            [ngClass]="activeTheme === 'light' ? 'bg-slate-50 border-slate-300 text-slate-900' : 'bg-white/5 border-white/10 text-white'">
        </div>

        <div>
          <label class="text-[10px] uppercase font-mono tracking-wider text-zinc-400 block mb-1">Description (Optional)</label>
          <textarea [(ngModel)]="newPlaylistDesc" rows="3" placeholder="Curated acoustic journey..."
            class="w-full px-3.5 py-2 rounded-xl text-xs font-medium border outline-none"
            [ngClass]="activeTheme === 'light' ? 'bg-slate-50 border-slate-300 text-slate-900' : 'bg-white/5 border-white/10 text-white'"></textarea>
        </div>
      </div>

      <div class="flex items-center justify-end space-x-3 pt-2">
        <button (click)="showCreateModal = false" class="px-4 py-2 rounded-xl text-xs font-semibold text-zinc-400 hover:text-white cursor-pointer">
          Cancel
        </button>
        <button (click)="createPlaylist()" [disabled]="creating || !newPlaylistName.trim()"
          class="px-5 py-2.5 rounded-xl text-xs font-bold transition-all active:scale-95 disabled:opacity-50 cursor-pointer shadow-lg"
          [ngClass]="getThemeBgClass()">
          {{ creating ? 'Creating on Spotify...' : 'Create Playlist' }}
        </button>
      </div>
    </div>
  </div>
</div>
